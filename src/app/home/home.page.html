<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Mi Ubicación GPS
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true" class="ion-padding">

  <div class="container">

    <div class="location-card"
         *ngIf="latitude() !== null && longitude() !== null">

      <div class="icon">
        📍
      </div>

      <h2>Ubicación actual</h2>

      <div class="coordinate">
        <span>Latitud</span>
        <strong>{{ latitude() }}</strong>
      </div>

      <div class="coordinate">
        <span>Longitud</span>
        <strong>{{ longitude() }}</strong>
      </div>

    </div>

    <div class="error"
         *ngIf="errorMsg()">

      {{ errorMsg() }}

    </div>

    <div class="buttons">

      <ion-button
        expand="block"
        shape="round"
        (click)="obtenerUbicacionActual()">

        Obtener ubicación

      </ion-button>

      <ion-button
        expand="block"
        shape="round"
        color="success"
        (click)="iniciarSeguimiento()"
        [disabled]="watchId !== null">

        Iniciar seguimiento

      </ion-button>

      <ion-button
        expand="block"
        shape="round"
        color="medium"
        (click)="detenerSeguimiento()"
        [disabled]="watchId === null">

        Detener seguimiento

      </ion-button>

      <ion-button
        expand="block"
        shape="round"
        color="dark"
        (click)="abrirGoogleMaps()"
        [disabled]="latitude() === null || longitude() === null">

        Abrir Google Maps

      </ion-button>

    </div>

  </div>

</ion-content>
